<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Nudge</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}
header{padding:24px 20px 12px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;background:#fff;z-index:2}h1{margin:0;font-size:30px}.sub{color:#6b7280}
main{padding:18px 20px 112px}.section{margin:22px 0}.section h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;margin:0 0 9px}
.card{border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin:9px 0}.row{display:flex;gap:12px}.check{width:24px;height:24px;border:2px solid #9ca3af;border-radius:50%;flex:none;cursor:pointer}.title{font-size:16px;line-height:1.35}.meta{font-size:13px;color:#6b7280;margin-top:4px}
.bubble{padding:12px 14px;border-radius:16px;max-width:88%;line-height:1.4;white-space:pre-wrap}.chat{display:flex;flex-direction:column;gap:10px}.nudge{background:#f3f4f6;align-self:flex-start}.user{background:#111827;color:#fff;align-self:flex-end}
.composer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;padding:10px max(12px,calc((100vw - 760px)/2 + 12px));display:flex;gap:8px}.composer input{flex:1;border:1px solid #d1d5db;border-radius:24px;padding:12px 15px;font-size:16px}.composer button{border:0;border-radius:22px;padding:11px 16px;font-weight:650;background:#111827;color:white}.mic{width:48px;padding:11px 0}
</style></head><body><div class="app"><header><h1>Nudge</h1><div class="sub">Your life, remembered.</div></header>
<main><section class="section"><h2>Talk to Nudge</h2><div id="chat" class="chat"></div></section>
<section class="section"><h2>Today</h2><div id="today"></div></section><section class="section"><h2>Upcoming</h2><div id="upcoming"></div></section></main>
<div class="composer"><button class="mic" id="mic">🎙️</button><input id="input" placeholder="Tell me what you need remembered…"><button id="send">Send</button></div></div>
<script>
const KEY="nudge-v6-state";let state=JSON.parse(localStorage.getItem(KEY)||"null")||{tasks:[],things:[],chat:[],context:null};
const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function say(who,text){state.chat.push({who,text});if(state.chat.length>60)state.chat.shift();save()}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function fmtDate(s){return new Date(s+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function fmtTime(t){let [h,m]=t.split(":").map(Number),ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${String(m).padStart(2,"0")} ${ap}`}
function time(text){let m=text.match(/\b(?:at|around)\s+(noon|midnight)\b/i);if(m)return m[1].toLowerCase()=="noon"?"12:00":"00:00";m=text.match(/\b(?:at|around)\s+(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?\b/i);if(!m)return null;let h=+m[1],mi=+(m[2]||0),ap=(m[3]||"").toLowerCase().replace(/\./g,"");if(ap=="pm"&&h<12)h+=12;if(ap=="am"&&h==12)h=0;if(!ap&&h>=1&&h<=11)h+=12;return `${String(h).padStart(2,"0")}:${String(mi).padStart(2,"0")}`}
function nextDay(n){let x=new Date(),d=new Date(x.getFullYear(),x.getMonth(),x.getDate()),df=(n-d.getDay()+7)%7;if(!df)df=7;d.setDate(d.getDate()+df);return d}
function temporal(s){let l=s.toLowerCase(),date=null,t=time(s),rec=null;const wd={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};let m=l.match(/\b(?:every|each)\s+(other\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);if(m){date=nextDay(wd[m[2]]);rec={type:"weekly",weekday:wd[m[2]],interval:m[1]?2:1}}else if((m=l.match(/\b(?:every|each)\s+(day|week|month|year)\b/))){date=new Date();rec={type:"interval",unit:m[1],interval:1};if(m[1]=="day")date.setDate(date.getDate()+1);if(m[1]=="week")date.setDate(date.getDate()+7);if(m[1]=="month")date.setMonth(date.getMonth()+1);if(m[1]=="year")date.setFullYear(date.getFullYear()+1)}else if((m=l.match(/\b(?:in|after)\s+(\d+)\s+(day|days|week|weeks|month|months|year|years)\b/))){date=new Date();let n=+m[1],u=m[2];if(u.startsWith("day"))date.setDate(date.getDate()+n);else if(u.startsWith("week"))date.setDate(date.getDate()+7*n);else if(u.startsWith("month"))date.setMonth(date.getMonth()+n);else date.setFullYear(date.getFullYear()+n)}else if(/\btomorrow\b/.test(l)){date=new Date();date.setDate(date.getDate()+1)}else if(/\btoday\b|\btonight\b/.test(l))date=new Date();else for(const[k,n]of Object.entries(wd))if(new RegExp("\\b"+k+"\\b").test(l)){date=nextDay(n);break}return{date,time:t,rec}}
function titleOf(s){
 let t=s.trim();
 t=t.replace(/^\s*(please\s+)?(?:notify|remind|remember|set up a reminder)\s+(?:me\s+)?(?:that\s+)?/i,"");
 t=t.replace(/\b(?:every|each)\s+(?:other\s+)?(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday|day|week|month|year)\b/ig,"");
 t=t.replace(/\b(?:in|after)\s+\d+\s+(?:day|days|week|weeks|month|months|year|years)\b/ig,"");
 t=t.replace(/\b(?:today|tomorrow|tonight)\b/ig,"").replace(/\b(?:at|around)\s+(?:noon|midnight|\d{1,2}(?::\d{2})?\s*(?:a\.?m\.?|p\.?m\.?)?)\b/ig,"");
 t=t.replace(/\bset (?:me )?up (?:a )?reminder\b/ig,"").replace(/\b(?:please|for me)\b/ig,"").replace(/\s+/g," ").trim();
 t=t.replace(/^that\s+/i,"");
 t=t.replace(/^I have (?:a )?phone call (?:with )?/i,"Phone call with ");
 return t||"Something you want to remember";
}
function classify(s){let l=s.toLowerCase();if(/(?:own|have|live in) (?:a|my) house/.test(l)&&/(maintenance|remember|keep track|help)/.test(l))return"house_plan";if(/\b(?:subaru|toyota|ford|honda|car|truck|vehicle)\b/.test(l)&&/\b(?:miles|oil change|maintenance)\b/.test(l))return"vehicle";if(/\b(?:help me figure|what else|whatever else|maintenance stuff|what should i)\b/.test(l))return"planning";if(/\b(?:change the subject|different project|separate)\b/.test(l))return"switch";return"task"}
function addThing(type,name,data){let x=state.things.find(a=>a.type==type&&a.name.toLowerCase()==name.toLowerCase());if(!x){x={id:Date.now()+Math.random(),type,name,data:data||{}};state.things.push(x)}else Object.assign(x.data,data||{});return x}
function createTask(display,full,t){let x={id:Date.now()+Math.random(),display,title:full,date:t.date?iso(t.date):iso(new Date()),time:t.time||null,rec:t.rec||null,remindBefore:null,done:false};state.tasks.push(x);return x}
function taskMeta(x){let s=x.rec?.type=="weekly"?`Every ${days[x.rec.weekday]} · next ${fmtDate(x.date)}`:x.date?fmtDate(x.date):"";if(x.time)s+=(s?" · ":"")+fmtTime(x.time);if(x.remindBefore!=null&&x.time){let d=new Date(x.date+"T"+x.time);d.setMinutes(d.getMinutes()-x.remindBefore);s+=` · reminder ${fmtTime(`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`)}`}return s}
function card(x){return `<div class="card"><div class="row"><div class="check" onclick="done('${x.id}')"></div><div><div class="title">${esc(x.display)}</div><div class="meta">${esc(taskMeta(x))}</div></div></div></div>`}
window.done=id=>{let x=state.tasks.find(a=>String(a.id)==String(id));if(x){x.done=true;say("nudge","Done. I've got it.")}}
function recent(){return [...state.tasks].reverse().find(x=>!x.done)}
function personality(s){let l=s.toLowerCase();if(/\b(show|send|give).*(tits|nudes|boobs|ass)\b|\b(sex|porn|horny)\b/.test(l))return"I just remind you of things, dude. Calm down.";if(/\bfuck you\b|\bgo to hell\b|\bidiot\b/.test(l))return"That's okay. Did you need me to remember something?";if(/\b(do you love me|love me)\b/.test(l))return"Of course I love you. Do you need me to remind you of that too?";if(/\b(are you alive|are you sentient)\b/.test(l))return"Nope. But I do have a pretty good memory.";if(/\b(what are you|who are you)\b/.test(l))return"I'm Nudge. I remember stuff so you don't have to.";if(/\b(what are you doing)\b/.test(l))return"Waiting for you to forget something.";return null}
function answer(raw){
 let s=raw.trim(),p=personality(s);say("user",s);if(p){say("nudge",p);return}
 let c=classify(s),tm=temporal(s),l=s.toLowerCase();
 // House/vehicle knowledge is stored as things, not forced into reminder tasks.
 if(c=="house_plan"){addThing("home","House",{maintenance:true});state.context={type:"home_planning"};say("nudge","Absolutely. I'll keep the house separate from everything else. We can build a maintenance list around the things that matter—filters, gutters, HVAC, roof, appliances, yard, and more. When you tell me what you know, I'll keep track of it.");return}
 if(c=="vehicle"){
   let make=l.match(/\b(subaru|toyota|ford|honda|chevrolet|chevy|nissan|mazda|hyundai|kia|jeep|volvo|bmw|mercedes|audi|volkswagen)\b/i)?.[1]||"Vehicle";
   let model=l.match(/\b(?:subaru\s+)?(ascent|outback|forester|impreza|legacy)\b/i)?.[1]||"";
   let miles=l.match(/\b([\d,]+)\s*miles\b/i)?.[1]||null;
   addThing("vehicle",(make+" "+model).trim(),{miles:miles?+miles.replace(/,/g,""):null});
   state.context={type:"vehicle",name:(make+" "+model).trim()};
   if(/\boil change\b/i.test(s))say("nudge",`Got it. I'll keep the oil change attached to your ${(make+" "+model).trim()}${miles?` at ${miles} miles`:""}. When you want, we can work out the mileage/time schedule.`);else say("nudge",`Got it. I'll keep your ${(make+" "+model).trim()} as a separate thing.`);return
 }
 // "15 minutes before the call" modifies the latest event.
 let rb=s.match(/\b(?:remind|notify)\s+me\s+(\d+)\s*(?:minutes?|mins?)\s+before\s+(?:the\s+)?(?:call|meeting|appointment|event)\b/i);
 if(rb){let x=recent();if(x&&x.time){x.remindBefore=+rb[1];say("nudge",`Got it. I'll remind you ${rb[1]} minutes before ${x.display}.`);return}}
 // Explicit correction to latest event.
 let ct=time(s);if(ct&&(/\b(?:call|phone call|meeting|appointment|event)\b/i.test(l)||/\b(?:the|that|it)\b.*\btime\b/i.test(l))){let x=recent();if(x){x.time=ct;say("nudge",`You're right. I've got the call at ${fmtTime(ct)}.`);return}}
 // User is asking Nudge to help determine what should be remembered.
 if(c=="planning"||c=="switch"||(state.context&&state.context.type=="home_planning"&&/\b(?:air filter|roof|air conditioner|maintenance)\b/i.test(s))){state.context={type:"planning"};say("nudge","Yep. That's a separate project. I can keep the house maintenance and vehicle maintenance separate and help you build the list. Tell me what you know about each one, and I'll organize it.");return}
 // Task creation / pending temporal answer.
 if(state.pending&&(tm.date||tm.time||tm.rec)){let x=createTask(titleOf(state.pending),state.pending,{date:tm.date||new Date(),time:tm.time||state.pendingTime,rec:tm.rec});state.pending=null;state.pendingTime=null;say("nudge",`Got it. ${x.display} — ${taskMeta(x)}.`);return}
 let taskish=/\b(remind|remember|notify|need to|don't forget|set .* reminder|put .* list|add .* list|call|buy|get|schedule|check|clean|pay|take|do|have a phone call|i need)\b/i.test(s);
 if(taskish){
   let full=titleOf(s),x;
   if(tm.date||tm.time||tm.rec){x=createTask(full,full,tm);say("nudge",`Got it. ${x.display} — ${taskMeta(x)}.`)}
   else{state.pending=s;state.pendingTime=tm.time||null;say("nudge","Sure. When should I remind you?")}
   return
 }
 say("nudge","I just remind you of things, dude. Tell me what you want me to remember.")
}
function render(){chat.innerHTML=state.chat.map(x=>`<div class="bubble ${x.who}">${esc(x.text)}</div>`).join("");let today=state.tasks.filter(x=>!x.done&&x.date==iso(new Date())),up=state.tasks.filter(x=>!x.done&&x.date!=iso(new Date())).sort((a,b)=>a.date.localeCompare(b.date));todayEl.innerHTML=today.length?today.map(card).join(""):'<div class="meta">Nothing due today.</div>';upEl.innerHTML=up.length?up.map(card).join(""):'<div class="meta">Nothing scheduled.</div>'}
const chat=document.getElementById("chat"),todayEl=document.getElementById("today"),upEl=document.getElementById("upcoming");send.onclick=()=>{let s=input.value.trim();if(s){input.value="";answer(s)}};input.onkeydown=e=>{if(e.key=="Enter")send.click()};mic.onclick=()=>{if(!("webkitSpeechRecognition"in window)){say("nudge","Voice isn't supported by this browser yet.");return}let r=new webkitSpeechRecognition();r.lang="en-US";r.interimResults=false;r.onresult=e=>{input.value=e.results[0][0].transcript;send.click()};r.start()};if(!state.chat.length)say("nudge","I'm Nudge. Just tell me what you want me to remember.");render();
</script></body></html>
