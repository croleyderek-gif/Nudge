<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nudge — Your life, remembered.</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#101827;--muted:#697386;--line:#e5e7eb;--accent:#101827;--soft:#eef1f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding:28px 18px 110px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.title{font-size:42px;font-weight:800;letter-spacing:-1.5px}.date{color:var(--muted);font-size:16px;margin-top:2px}.gear{border:1px solid var(--line);background:#fff;border-radius:50%;width:42px;height:42px;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 3px 15px #00000008}
h2{font-size:13px;letter-spacing:1.4px;color:#687183;margin:0 0 14px;text-transform:uppercase}
.task{display:flex;gap:13px;align-items:flex-start;padding:15px 0;border-top:1px solid var(--line)}.task:first-of-type{border-top:0}
.check{width:25px;height:25px;border:1.5px solid #9299a4;border-radius:7px;background:#fff;flex:none}.task-main{flex:1}.task-title{font-size:18px;line-height:1.3}.task-meta{color:var(--muted);font-size:14px;margin-top:5px}.later{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:650}
.empty{color:var(--muted);padding:8px 0}.chat{display:flex;flex-direction:column;gap:10px;max-height:410px;overflow:auto}.bubble{padding:12px 15px;border-radius:18px;max-width:88%;line-height:1.4}.nudge{background:var(--soft);align-self:flex-start}.me{background:var(--accent);color:#fff;align-self:flex-end}
.composer{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(724px,calc(100% - 28px));display:flex;gap:8px;background:#101827;padding:8px;border-radius:18px;box-shadow:0 12px 35px #0005}
input{min-width:0;flex:1;border:0;background:#fff;border-radius:12px;padding:14px;font-size:16px;outline:none}.send,.mic{border:0;border-radius:12px;background:#fff;color:#101827;font-weight:800;padding:0 16px}.mic{width:54px;font-size:21px}
.small{font-size:13px;color:var(--muted)}.hidden{display:none!important}
dialog{border:0;border-radius:20px;padding:22px;max-width:480px;width:calc(100% - 32px)}dialog::backdrop{background:#0008}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.close{margin-top:16px;width:100%;padding:12px;border:0;border-radius:12px;background:#101827;color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="title">Today</div><div class="date" id="date"></div></div><button class="gear" id="settings">⚙</button></div>

  <section class="card">
    <h2>Your stuff</h2>
    <div id="tasks"></div>
  </section>

  <section class="card">
    <h2>Talk to Nudge</h2>
    <div class="chat" id="chat"></div>
    <div class="small" style="margin-top:10px">Talk naturally. Nudge will ask follow-up questions when it needs more information.</div>
  </section>
</div>

<div class="composer">
  <button class="mic" id="mic" title="Talk">🎙</button>
  <input id="input" autocomplete="off" placeholder="Tell me something to remember…">
  <button class="send" id="send">Send</button>
</div>

<dialog id="settingsDialog">
  <h2>Settings</h2>
  <div class="row"><span>Follow-up reminders</span><select id="follow"><option>Normal</option><option>Off</option><option>Persistent</option></select></div>
  <div class="row"><span>Morning summary</span><select id="morning"><option>On</option><option>Off</option></select></div>
  <button class="close" id="closeSettings">Done</button>
</dialog>

<script>
const KEY="nudge_v3_tasks", CHAT="nudge_v3_chat", SETTINGS="nudge_v3_settings";
let tasks=JSON.parse(localStorage.getItem(KEY)||"[]");
let chat=JSON.parse(localStorage.getItem(CHAT)||"[]");
let settings=JSON.parse(localStorage.getItem(SETTINGS)||'{"follow":"Normal","morning":"On"}');
let pending=null;

const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(tasks));
const saveChat=()=>localStorage.setItem(CHAT,JSON.stringify(chat));
const todayDate=dateOnly(new Date());

$("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+".";

function dateOnly(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function iso(d){return d.toISOString().slice(0,10)}
function fmt(d){return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function pad(n){return String(n).padStart(2,"0")}
function localISO(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function startOfWeek(d){let x=dateOnly(d), day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));return x}
function nextWeekday(name){
 const names=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
 const target=names.indexOf(name.toLowerCase()), d=dateOnly(new Date());
 let delta=(target-d.getDay()+7)%7; if(delta===0)delta=7;
 return addDays(d,delta);
}

function parseTime(text){
 let t=text.toLowerCase();
 let m=t.match(/\b(?:at\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
 if(m){
   let h=+m[1], min=+(m[2]||0), ap=m[3];
   if(ap==="pm"&&h<12)h+=12;if(ap==="am"&&h===12)h=0;
   return {hour:h,minute:min,label:`${h%12||12}:${pad(min)} ${h>=12?"PM":"AM"}`};
 }
 m=t.match(/\bat\s+(\d{1,2})(?::(\d{2}))?\b/);
 if(m){
   let h=+m[1], min=+(m[2]||0);
   // Without am/pm, preserve the user's stated hour but don't invent
   // morning/evening semantics. Noon is special-cased.
   if(h===12)return {hour:12,minute:min,label:`12:${pad(min)} PM`};
 }
 if(/\bnoon\b/.test(t))return {hour:12,minute:0,label:"12:00 PM"};
 if(/\bmidnight\b/.test(t))return {hour:0,minute:0,label:"12:00 AM"};
 return null;
}

function parseDate(text){
 const t=text.toLowerCase(), base=dateOnly(new Date());
 if(/\btoday\b/.test(t))return base;
 if(/\btomorrow\b/.test(t))return addDays(base,1);
 if(/\btonight\b/.test(t))return base;
 if(/\bnext week\b/.test(t))return addDays(base,7);

 let m=t.match(/\b(?:in|after)\s+(\d+)\s+(day|days|week|weeks|month|months|year|years)\b/);
 if(m){
   let n=+m[1],u=m[2];
   if(u.startsWith("day"))return addDays(base,n);
   if(u.startsWith("week"))return addDays(base,n*7);
   if(u.startsWith("month")){let d=new Date(base);d.setMonth(d.getMonth()+n);return d}
   let d=new Date(base);d.setFullYear(d.getFullYear()+n);return d;
 }
 m=t.match(/\bnext\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
 if(m)return nextWeekday(m[1]);

 const months=["january","february","march","april","may","june","july","august","september","october","november","december"];
 m=t.match(/\b(?:on\s+)?([a-z]+)\s+(\d{1,2})(?:st|nd|rd|th)?(?:\s+(\d{4}))?\b/);
 if(m){
   let mi=months.indexOf(m[1]);
   if(mi>=0){
     let y=+(m[3]||base.getFullYear()),d=new Date(y,mi,+m[2]);
     if(!m[3]&&d<base)d.setFullYear(y+1);
     return d;
   }
 }
 return null;
}

function recurrence(text){
 const m=text.toLowerCase().match(/\b(?:every|each)\s+(\d+)\s+(day|days|week|weeks|month|months|year|years)\b/);
 if(!m)return null;
 return {n:+m[1],unit:m[2].replace(/s$/,"")};
}

function stripScheduling(text){
 let t=text;
 t=t.replace(/\b(?:in|after)\s+\d+\s+(?:day|days|week|weeks|month|months|year|years)\b/ig,"");
 t=t.replace(/\b(?:every|each)\s+\d+\s+(?:day|days|week|weeks|month|months|year|years)\b/ig,"");
 t=t.replace(/\b(?:today|tomorrow|tonight|noon|midnight)\b/ig,"");
 t=t.replace(/\b(?:next\s+week|next\s+(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday))\b/ig,"");
 t=t.replace(/\b(?:at\s+)?\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/ig,"");
 return t.replace(/\s+/g," ").trim();
}

function cleanTitle(text){
 let t=stripScheduling(text);
 t=t.replace(/^(?:and\s+)?(?:please\s+)?(?:just\s+)?(?:put|add)\s+(?:it|that)\s+(?:on|to)\s+(?:the\s+)?list\b/ig,"");
 t=t.replace(/^(?:please\s+)?remind\s+me\s+(?:to\s+)?/i,"");
 t=t.replace(/^(?:remember\s+to\s+|don't\s+let\s+me\s+forget\s+|i\s+(?:need|have|want)\s+to\s+|i\s+need\s+|i\s+have\s+to\s+)/i,"");
 t=t.replace(/\b(?:right now|for now)\b/ig,"");
 t=t.replace(/\s+/g," ").replace(/\s+([,.!?])/g,"$1").trim();
 if(!t)return "Task";
 return t.charAt(0).toUpperCase()+t.slice(1);
}

function extractTask(text){
 let t=text.trim();
 // Scheduling phrases are not the task. Pull them out and keep the rest.
 let title=cleanTitle(t);
 // Common conversational filler should not become the task.
 title=title.replace(/^(?:okay|ok|yeah|yes|sure)[,\s]+/i,"").trim();
 return title||"Task";
}

function dueLabel(t){
 let d=new Date(t.due);
 let label=fmt(d);
 if(t.time)label+=" · "+t.time;
 if(t.recur)label+=` · every ${t.recur.n} ${t.recur.unit}${t.recur.n===1?"":"s"}`;
 return label;
}

function render(){
 const box=$("tasks"), now=dateOnly(new Date());
 let visible=tasks.filter(t=>!t.done && dateOnly(new Date(t.due))<=now)
   .sort((a,b)=>(a.due+a.time||"").localeCompare(b.due+b.time||""));
 box.innerHTML=visible.length?visible.map(t=>`
 <div class="task">
   <button class="check" data-done="${t.id}"></button>
   <div class="task-main">
     <div class="task-title">${esc(t.title)}</div>
     <div class="task-meta">${esc(dueLabel(t))}</div>
   </div>
   <button class="later" data-later="${t.id}">Later</button>
 </div>`).join(""):'<div class="empty">Nothing you need to do today. Nice.</div>';
 document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>complete(b.dataset.done));
 document.querySelectorAll("[data-later]").forEach(b=>b.onclick=()=>postpone(b.dataset.later));
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function addTask(title,due,recur=null,time=null){
 const t={id:crypto.randomUUID(),title:cleanTitle(title),due:iso(due),recur,time,done:false,created:Date.now()};
 tasks.push(t);save();render();return t;
}

function complete(id){
 const t=tasks.find(x=>x.id===id);if(!t)return;
 if(t.recur){
   let d=new Date(t.due);
   if(t.recur.unit==="day")d=addDays(d,t.recur.n);
   if(t.recur.unit==="week")d=addDays(d,7*t.recur.n);
   if(t.recur.unit==="month")d.setMonth(d.getMonth()+t.recur.n);
   if(t.recur.unit==="year")d.setFullYear(d.getFullYear()+t.recur.n);
   t.due=iso(d);
 }else t.done=true;
 save();render();
 say(t.recur?`Done. I'll remind you again ${fmt(new Date(t.due))}${t.time?" at "+t.time:""}.`:`Done — I'll leave that one alone.`);
}

function postpone(id){
 const t=tasks.find(x=>x.id===id);if(!t)return;
 t.due=iso(addDays(new Date(),1));save();render();
 say(`Okay. I'll move "${t.title}" to tomorrow.`);
}

function say(text){
 chat.push({who:"nudge",text});saveChat();renderChat();
}
function renderChat(){
 $("chat").innerHTML=chat.slice(-20).map(x=>`<div class="bubble ${x.who==="me"?"me":"nudge"}">${esc(x.text)}</div>`).join("");
 $("chat").scrollTop=$("chat").scrollHeight;
}

// A conversational task workflow.
// pending is an object, not a magic string hidden in the text.
function beginTask(title){
 pending={title,needDate:false};
 askDateOrConfirm();
}

function askDateOrConfirm(){
 if(!pending)return;
 if(pending.needDate){
   say(`When should I put "${pending.title}" on your list?`);
 }else{
   say(`Okay. When do you want to do "${pending.title}"?`);
   pending.needDate=true;
 }
}

function finishPending(text){
 if(!pending)return false;

 const d=parseDate(text);
 const time=parseTime(text);
 const r=recurrence(text);

 // "just put it on the list" means TODAY when we're already
 // discussing a task and the user doesn't specify another date.
 if(/\b(?:just\s+)?put\s+(?:it|that)\s+(?:on|to)\s+(?:the\s+)?list\b/i.test(text) ||
    /^(?:add|save)\s+(?:it|that)\s*(?:to\s+the\s+list)?$/i.test(text.trim())){
   const t=addTask(pending.title,dateOnly(new Date()),r,time?.label||null);
   pending=null;
   say(`Got it. "${t.title}" is on today's list.`);
   return true;
 }

 // A bare "today" is a perfectly valid answer.
 if(d){
   const title=pending.title;
   const t=addTask(title,d,r,time?.label||null);
   pending=null;
   let when=d.toDateString()===dateOnly(new Date()).toDateString()?"today":fmt(d);
   say(`Got it. I'll put "${t.title}" on your list for ${when}${time?" at "+time.label:""}${r?` and repeat every ${r.n} ${r.unit}${r.n===1?"":"s"}`:""}.`);
   return true;
 }

 // User may simply say "yes" after being asked to remember.
 if(/^(yes|yeah|yep|sure|okay|ok|do it|sounds good)$/i.test(text.trim()) && pending.needDate){
   say(`Sure. I just need to know when. "Today" works if you want it today.`);
   return true;
 }

 // Correct date-only followup even when it is phrased naturally.
 if(/\b(?:today|tomorrow|tonight|noon|midnight)\b/i.test(text)){
   const title=pending.title;
   const dd=parseDate(text)||dateOnly(new Date());
   const tt=parseTime(text);
   const t=addTask(title,dd,r,tt?.label||null);
   pending=null;
   say(`Got it. "${t.title}" is set for ${fmt(dd)}${tt?" at "+tt.label:""}.`);
   return true;
 }

 return false;
}

function handle(text){
 text=text.trim();if(!text)return;
 chat.push({who:"me",text});saveChat();renderChat();

 // First let an existing conversation resolve itself.
 if(pending){
   if(finishPending(text))return;

   // If the user changes the task while answering, treat the new sentence
   // as a fresh request rather than forcing it through the old question.
   if(/\b(?:i need|i have to|remind me|remember|put .* on the list|add .* to the list)\b/i.test(text)){
     pending=null;
   }else{
     say(`I can do that. Just give me a simple time like "today", "tomorrow", "at noon today", "next Tuesday", or "in 30 days."`);
     return;
   }
 }

 const d=parseDate(text), time=parseTime(text), r=recurrence(text);
 const lower=text.toLowerCase();

 // Direct, complete request: create immediately.
 // This is the important path for "have a phone call with Ken Braman today at noon".
 if(d){
   let title=extractTask(text);
   // If the entire phrase is just scheduling information, ask what the task is.
   if(!title || /^(today|tomorrow|tonight|noon|midnight|next week)$/i.test(title)){
     say("Sure. What do you want me to put on your list?");
     pending={title:"Task",needDate:false};
     return;
   }
   const t=addTask(title,d,r,time?.label||null);
   say(`Got it. "${t.title}" is on your list for ${d.toDateString()===dateOnly(new Date()).toDateString()?"today":fmt(d)}${time?" at "+time.label:""}${r?` and repeats every ${r.n} ${r.unit}${r.n===1?"":"s"}`:""}.`);
   return;
 }

 // "Put X on the list" without a date means today.
 if(/\b(?:put|add)\b.*\b(?:on|to)\b.*\blist\b/i.test(text)){
   let title=extractTask(text);
   const t=addTask(title,dateOnly(new Date()),r,time?.label||null);
   say(`Done. "${t.title}" is on today's list.`);
   return;
 }

 // Explicit reminder request without a date: ask once, naturally.
 if(/\b(?:remind me|remember to|don't let me forget|i need to|i have to|i've got to|i gotta)\b/i.test(lower)){
   beginTask(extractTask(text));
   return;
 }

 // Household / life-administration topics can start a conversation.
 if(/\b(?:air filter|hvac|gutters|roof|oil change|cat litter|laundry|sheets|groceries|dishes|moving|move|plumber|phone call|call)\b/i.test(lower)){
   beginTask(extractTask(text));
   return;
 }

 // "What am I forgetting?" should not create a task.
 if(/\bwhat am i forgetting\b|\bwhatever\b|\bwhat should i do\b/i.test(lower)){
   say("I can help with that. Tell me about your home, vehicles, pets, upcoming plans, or anything you keep putting off, and I'll help build the list.");
   return;
 }

 say("I can remember things for you. Try something like, “call Ken Braman today at noon,” “change the air filters in 30 days,” or “put laundry on the list.”");
}

$("send").onclick=()=>{const v=$("input").value;$("input").value="";handle(v)};
$("input").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click()});

$("settings").onclick=()=>{
 $("follow").value=settings.follow;$("morning").value=settings.morning;$("settingsDialog").showModal();
};
$("closeSettings").onclick=()=>{
 settings.follow=$("follow").value;settings.morning=$("morning").value;
 localStorage.setItem(SETTINGS,JSON.stringify(settings));$("settingsDialog").close();
};

$("mic").onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){say("Voice input isn't supported by this browser. You can still type to me.");return}
 const r=new SR();r.lang=navigator.language||"en-US";r.interimResults=false;r.maxAlternatives=1;
 r.onresult=e=>handle(e.results[0][0].transcript);
 r.onerror=()=>say("I didn't catch that. Try again.");
 r.start();
};

if(!chat.length){
 say("Hey. I'm Nudge. Tell me what you need to remember. You don't have to phrase it perfectly.");
}
render();renderChat();

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
